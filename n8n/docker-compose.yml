services:
  n8n:
    image: n8nio/n8n:latest
    container_name: novadom-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    env_file:
      - .env            # GEMINI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY (see .env.example)
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=Europe/Sofia
      # Allow expressions to read the secrets above via {{ $env.NAME }}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Pass the secrets through so workflow expressions can use them
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
